name: Docker

# Ushbu workflow GitHub tomonidan sertifikatlanmagan action'lardan foydalanadi.
# Ular uchinchi tomon tomonidan taqdim etiladi va alohida
# xizmat ko'rsatish shartlari, maxfiylik siyosati hamda qo'llab-quvvatlash
# hujjatlari bilan tartibga solinadi.

on:
  schedule:
- cron: '22 2 * * *'
  push:
    branches: [ "main" ]
    # Semver teglarini reliz sifatida nashr etish.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  # Agar bo'sh bo'lsa, Docker Hub uchun docker.io dan foydalaning
  REGISTRY: ghcr.io
  # github.repository <akkaunt>/<repo> ko'rinishida
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Bu PR'lardan tashqarida ishlaganda sigstore/fulcio bilan
      # identifikatsiya tekshiruvini yakunlash uchun ishlatiladi.
      id-token: write

    steps:
- name: Checkout repository
        uses: actions/checkout@v4

      # Pull request'lardan tashqari holatlarda cosign o'rnatish.
      # Sigstore endi Cosign v3 relizlari uchun v4 o'rnatuvchisini tavsiya qiladi.
- name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.1

      # Vaqtinchalik yechim: https://github.com/docker/build-push-action/issues/461
- name: Setup Docker buildx
        uses: docker/setup-buildx-action@79abd3f86f79a9d68a23c75a09a9a85889262adf

      # PR dan tashqari holatlarda Docker registriga kirish
      # https://github.com/docker/login-action
- name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@28218f9b04b4f3f62068d7b6ce6ca5b26e35336c
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker uchun metama'lumotlarni (teglar, yorliqlar) ajratib olish
      # https://github.com/docker/metadata-action
- name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Buildx bilan Docker tasvirini yaratish va yuklash (PR da yuklanmaydi)
      # https://github.com/docker/build-push-action
- name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # PR'lardan tashqari holatlarda yaratilgan Docker tasviri dayjestini imzolash.
      # Ma'lumotlar sizib chiqishining oldini olish uchun Docker repozitoriysi ommaviy
      # bo'lgandagina ommaviy Rekor shaffoflik jurnaliga yoziladi. Agar xususiy tasvirlar
      # uchun ham shaffoflik ma'lumotlarini nashr qilmoqchi bo'lsangiz, quyidagi cosign buyrug'iga --force qo'shing.
      # https://github.com/sigstore/cosign
- name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # Ushbu qadam sigstore hamjamiyatining Fulcio nusxasiga qarshi
        # vaqtinchalik sertifikat berish uchun identifikatsiya tokenidan foydalanadi.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
